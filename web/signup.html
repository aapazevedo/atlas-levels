<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - Atlas Levels</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .signup-container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 40px;
      width: 100%;
      max-width: 450px;
    }

    .logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo h1 {
      font-size: 32px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 10px;
    }

    .logo p {
      color: #666;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 500;
      font-size: 14px;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 15px;
      transition: all 0.3s;
    }

    input[type="email"]:focus,
    input[type="password"]:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .btn-signup {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      margin-top: 10px;
    }

    .btn-signup:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }

    .btn-signup:active {
      transform: translateY(0);
    }

    .btn-signup:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .status-message {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
    }

    .status-message.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .status-message.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .divider {
      text-align: center;
      margin: 25px 0;
      position: relative;
    }

    .divider::before {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      width: 100%;
      height: 1px;
      background: #e0e0e0;
    }

    .divider span {
      background: white;
      padding: 0 15px;
      position: relative;
      color: #999;
      font-size: 14px;
    }

    .login-link {
      text-align: center;
      margin-top: 20px;
      color: #666;
      font-size: 14px;
    }

    .login-link a {
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
    }

    .login-link a:hover {
      text-decoration: underline;
    }

    .password-requirements {
      font-size: 12px;
      color: #666;
      margin-top: 5px;
    }

    .features {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid #e0e0e0;
    }

    .features h3 {
      font-size: 14px;
      color: #333;
      margin-bottom: 15px;
      text-align: center;
    }

    .feature-item {
      display: flex;
      align-items: center;
      margin-bottom: 10px;
      font-size: 13px;
      color: #666;
    }

    .feature-item::before {
      content: '✓';
      color: #667eea;
      font-weight: bold;
      margin-right: 10px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="signup-container">
    <div class="logo">
      <h1>Atlas Levels</h1>
      <p>Níveis históricos organizados para trading profissional</p>
    </div>

    <div id="statusMessage" class="status-message"></div>

    <form id="signupForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required placeholder="seu@email.com">
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <input type="password" id="password" name="password" required placeholder="Mínimo 6 caracteres">
        <div class="password-requirements">
          Mínimo 6 caracteres
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirmar Senha</label>
        <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Digite a senha novamente">
      </div>

      <button type="submit" class="btn-signup" id="signupBtn">
        Criar Conta
      </button>
    </form>

    <div class="login-link">
      Já tem uma conta? <a href="/app">Fazer login</a>
    </div>

    <div class="features">
      <h3>O que você terá acesso:</h3>
      <div class="feature-item">Níveis históricos de WIN, WDO e BIT</div>
      <div class="feature-item">Ativos globais (BTCUSD, XAUUSD, ES, NAS100)</div>
      <div class="feature-item">Atualização em tempo real</div>
      <div class="feature-item">Planos flexíveis a partir de R$ 97/mês</div>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const statusMessage = $('statusMessage');
    const signupForm = $('signupForm');
    const signupBtn = $('signupBtn');

    function showStatus(message, isSuccess) {
      statusMessage.textContent = message;
      statusMessage.className = `status-message ${isSuccess ? 'success' : 'error'}`;
      statusMessage.style.display = 'block';
      
      setTimeout(() => {
        statusMessage.style.display = 'none';
      }, 5000);
    }

    signupForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = $('email').value.trim();
      const password = $('password').value;
      const confirmPassword = $('confirmPassword').value;

      // Validações
      if (!email || !password || !confirmPassword) {
        showStatus('Preencha todos os campos', false);
        return;
      }

      if (password !== confirmPassword) {
        showStatus('As senhas não coincidem', false);
        return;
      }

      if (password.length < 6) {
        showStatus('A senha deve ter no mínimo 6 caracteres', false);
        return;
      }

      // Desabilitar botão
      signupBtn.disabled = true;
      signupBtn.textContent = 'Criando conta...';

      try {
        const response = await fetch('/api/auth/register', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok) {
          // Salvar token no localStorage
          localStorage.setItem('token', data.access_token);
          localStorage.setItem('role', data.role);

          showStatus('Conta criada com sucesso! Redirecionando...', true);
          
          // Redirecionar para a página de pagamento após 1 segundo
          setTimeout(() => {
            window.location.href = '/payment';
          }, 1000);
        } else {
          showStatus(data.detail || 'Erro ao criar conta', false);
          signupBtn.disabled = false;
          signupBtn.textContent = 'Criar Conta';
        }
      } catch (error) {
        showStatus('Erro ao conectar com o servidor', false);
        signupBtn.disabled = false;
        signupBtn.textContent = 'Criar Conta';
      }
    });

    // Página de cadastro - sem redirecionamento automático
    // Permite que usuários acessem livremente
  </script>
</body>
</html>
