<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redefinir Senha - Atlas Levels</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .reset-container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 40px;
      width: 100%;
      max-width: 450px;
    }

    .logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo h1 {
      font-size: 32px;
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 10px;
    }

    .logo p {
      color: #666;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 500;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      font-size: 16px;
      transition: all 0.3s;
    }

    input:focus {
      outline: none;
      border-color: #f59e0b;
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.1);
    }

    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(245, 158, 11, 0.3);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .message {
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
    }

    .message.success {
      background: #d1fae5;
      color: #065f46;
      border: 1px solid #6ee7b7;
    }

    .message.error {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fca5a5;
    }

    .message.show {
      display: block;
    }

    .back-link {
      text-align: center;
      margin-top: 20px;
    }

    .back-link a {
      color: #f59e0b;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    }

    .back-link a:hover {
      text-decoration: underline;
    }

    .password-requirements {
      font-size: 12px;
      color: #666;
      margin-top: 8px;
    }

    .loading {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #ffffff;
      border-radius: 50%;
      border-top-color: transparent;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="reset-container">
    <div class="logo">
      <h1>🔑 Atlas Levels</h1>
      <p>Redefinir Senha</p>
    </div>

    <div id="message" class="message"></div>

    <form id="resetForm">
      <div class="form-group">
        <label for="password">Nova Senha</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          placeholder="Digite sua nova senha"
          required
          minlength="6"
        >
        <div class="password-requirements">
          Mínimo de 6 caracteres
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirmar Nova Senha</label>
        <input 
          type="password" 
          id="confirmPassword" 
          name="confirmPassword" 
          placeholder="Digite novamente sua nova senha"
          required
          minlength="6"
        >
      </div>

      <button type="submit" class="btn" id="submitBtn">
        Redefinir Senha
      </button>
    </form>

    <div class="back-link">
      <a href="/signup">← Voltar para o login</a>
    </div>
  </div>

  <script>
    // Obter token da URL
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    // Verificar se o token existe
    if (!token) {
      showMessage('Token inválido ou ausente. Por favor, solicite um novo link de recuperação.', 'error');
      document.getElementById('resetForm').style.display = 'none';
    }

    // Função para mostrar mensagens
    function showMessage(text, type) {
      const messageEl = document.getElementById('message');
      messageEl.textContent = text;
      messageEl.className = `message ${type} show`;
    }

    // Função para ocultar mensagens
    function hideMessage() {
      const messageEl = document.getElementById('message');
      messageEl.className = 'message';
    }

    // Handler do formulário
    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideMessage();

      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const submitBtn = document.getElementById('submitBtn');

      // Validar senhas
      if (password !== confirmPassword) {
        showMessage('As senhas não coincidem. Por favor, tente novamente.', 'error');
        return;
      }

      if (password.length < 6) {
        showMessage('A senha deve ter no mínimo 6 caracteres.', 'error');
        return;
      }

      // Desabilitar botão e mostrar loading
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="loading"></span> Redefinindo...';

      try {
        const response = await fetch('/api/auth/password-reset/confirm', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            token: token,
            new_password: password
          })
        });

        const data = await response.json();

        if (response.ok) {
          showMessage('✅ Senha redefinida com sucesso! Redirecionando para o login...', 'success');
          
          // Redirecionar para o login após 2 segundos
          setTimeout(() => {
            window.location.href = '/signup';
          }, 2000);
        } else {
          showMessage(data.detail || 'Erro ao redefinir senha. Por favor, tente novamente.', 'error');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Redefinir Senha';
        }
      } catch (error) {
        console.error('Erro:', error);
        showMessage('Erro ao conectar com o servidor. Por favor, tente novamente.', 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Redefinir Senha';
      }
    });
  </script>
</body>
</html>
